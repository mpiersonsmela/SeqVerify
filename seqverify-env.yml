name: seqverify-main
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bcftools
  - blast
  - bracken
  - bwa
  - bwa-mem2
  - cnvpytor
  - crossmap
  - htslib
  - idna
  - igv=2.13.2
  - igv-reports
  - kraken2
  - matplotlib
  - numpy
  - openjdk=21
  - pip
  - pysam             # non-HDR allele classifier
  - python=3.10
  - samtools
  - scipy
  - snpeff=5.3
  - snpsift=5.3
  - spades            # de-novo assembly of non-HDR reads (non-HDR allele analysis)
